
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KASU PRO v5 - Sistem Stabil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@300;500;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg-dark: #0a0a0c; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 50%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
        }
        .btn-gold {
            background: linear-gradient(135deg, #d4af37 0%, #f1d37c 100%);
            color: #000;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-md mx-auto">
        <!-- Dashboard Header -->
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 flex items-center justify-center glass border border-gold/30 text-gold font-bold">K</div>
                <h1 class="font-cyber tracking-widest text-sm">KASU <span class="text-gold">V5</span></h1>
            </div>
            <div id="status" class="text-[8px] tracking-[0.2em] font-bold py-1 px-3 glass">MENGHUBUNGKAN...</div>
        </div>

        <!-- Saldo Display -->
        <div class="glass p-8 mb-8 border border-gold/20 text-center relative overflow-hidden">
            <p class="text-[9px] uppercase tracking-[0.3em] text-gold/60 mb-2">Total Saldo Terkini</p>
            <h2 class="font-cyber text-4xl font-bold tracking-tighter" id="total-saldo">¥0</h2>
            <div id="loading-bar" class="absolute bottom-0 left-0 h-[1px] bg-gold w-0 transition-all duration-500"></div>
        </div>

        <!-- Input Section -->
        <div class="glass p-6 mb-8">
            <div class="space-y-4">
                <input type="text" id="ket" placeholder="KETERANGAN" class="w-full bg-black/40 p-4 rounded-xl text-xs outline-none border border-white/5 focus:border-gold/50 transition-all">
                <input type="number" id="nom" placeholder="NOMINAL (¥)" class="w-full bg-black/40 p-4 rounded-xl text-xs outline-none border border-white/5 focus:border-gold/50 font-cyber">
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="saveData('masuk')" class="btn-gold p-4 rounded-xl active:scale-95 transition-all text-[10px]">MASUK 入金</button>
                    <button onclick="saveData('keluar')" class="bg-white/5 border border-white/10 p-4 rounded-xl active:scale-95 transition-all text-[10px] text-rose-500 font-bold">KELUAR 出金</button>
                </div>
            </div>
        </div>

        <!-- History -->
        <div class="flex items-center justify-between mb-4 px-2">
            <span class="text-[9px] font-bold uppercase tracking-widest opacity-40">Catatan Transaksi</span>
            <span id="counter" class="font-cyber text-[10px] text-gold">00</span>
        </div>

        <div id="history-list" class="space-y-3">
            <!-- Items appear here -->
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiMAg6_CsXal5g_EXLbgoQ35VIboSRJ4A",
            authDomain: "kas-ac289.firebaseapp.com",
            databaseURL: "https://kas-ac289-default-rtdb.firebaseio.com",
            projectId: "kas-ac289",
            storageBucket: "kas-ac289.firebasestorage.app",
            messagingSenderId: "341907599331",
            appId: "1:341907599331:web:35f1d7e63014899a4abad6"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dbRef = db.ref('luxury_kas_v5'); // Path database baru

        // Fungsi Simpan
        function saveData(type) {
            const keterangan = document.getElementById('ket').value;
            const nominal = document.getElementById('nom').value;
            if(!keterangan || !nominal) return;

            dbRef.push({
                description: keterangan.toUpperCase(),
                amount: parseInt(nominal),
                type: type,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                document.getElementById('ket').value = "";
                document.getElementById('nom').value = "";
            }).catch(e => alert("Gagal Simpan: " + e.message));
        }

        // FUNGSI HAPUS (MENGGUNAKAN METODE LANGSUNG)
        window.deleteEntry = function(key) {
            const confirmation = confirm("Hapus permanen data ini?");
            if (confirmation) {
                // Memanggil remove langsung ke path item
                db.ref('luxury_kas_v5/' + key).remove()
                .then(() => {
                    console.log("Item " + key + " berhasil dihapus.");
                })
                .catch((error) => {
                    alert("Gagal menghapus! Pesan: " + error.message);
                    console.error("Hapus error: ", error);
                });
            }
        }

        // Koneksi Status
        db.ref(".info/connected").on("value", (s) => {
            const st = document.getElementById('status');
            st.innerText = s.val() ? "TERHUBUNG" : "TERPUTUS";
            st.style.color = s.val() ? "#00f2ff" : "#ff3333";
        });

        // Update Realtime
        dbRef.on('value', (snap) => {
            const list = document.getElementById('history-list');
            const totalDisplay = document.getElementById('total-saldo');
            const countDisplay = document.getElementById('counter');
            
            list.innerHTML = "";
            let total = 0;
            let count = 0;

            const val = snap.val();
            if(!val) {
                totalDisplay.innerText = "¥0";
                countDisplay.innerText = "00";
                list.innerHTML = "<div class='text-center py-12 opacity-20 text-[9px] tracking-widest uppercase italic'>Sistem Kosong</div>";
                return;
            }

            const arr = Object.keys(val).map(k => ({id: k, ...val[k]})).sort((a,b) => b.timestamp - a.timestamp);

            arr.forEach(item => {
                count++;
                const isInc = item.type === 'masuk';
                total += isInc ? item.amount : -item.amount;

                const itemDiv = document.createElement('div');
                itemDiv.className = "glass p-4 flex justify-between items-center border-l-2 " + (isInc ? 'border-l-cyan-400' : 'border-l-rose-500');
                itemDiv.innerHTML = `
                    <div>
                        <h4 class="text-[10px] font-bold tracking-widest">${item.description}</h4>
                        <p class="text-[7px] opacity-30 mt-1">${new Date(item.timestamp).toLocaleTimeString()}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-cyber text-[11px] ${isInc ? 'text-cyan-400' : 'text-rose-500'}">
                            ${isInc ? '+' : '-'} ${item.amount.toLocaleString()}
                        </span>
                        <button onclick="deleteEntry('${item.id}')" class="p-2 text-white/20 hover:text-rose-500 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </button>
                    </div>
                `;
                list.appendChild(itemDiv);
            });

            totalDisplay.innerText = "¥" + total.toLocaleString();
            countDisplay.innerText = count < 10 ? "0"+count : count;
            
            // Animasi Bar
            document.getElementById('loading-bar').style.width = "100%";
            setTimeout(() => document.getElementById('loading-bar').style.width = "0%", 400);
        });
    </script>
</body>
</html>
