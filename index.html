<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAS APATO 404 - JAPAN EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --sakura: #ffb7c5;
            --osaka-neon: #00f2ff;
            --tokyo-red: #d63031;
            --night-sky: #0f172a;
        }

        body {
            font-family: 'Shippori Mincho', serif;
            background-color: var(--night-sky);
            background-image: url('1.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
        }

        .glass-overlay {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(214, 48, 49, 0.1));
            min-height: 100vh;
            backdrop-filter: blur(8px);
        }

        /* Animasi Kelopak Sakura */
        .sakura-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .sakura {
            position: absolute;
            background-color: var(--sakura);
            border-radius: 100% 0 100% 0;
            opacity: 0.4;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Stempel Hanko Tradisional */
        .hanko-stamp {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            border: 2px solid var(--tokyo-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--tokyo-red);
            font-size: 8px;
            font-weight: bold;
            transform: rotate(15deg);
            opacity: 0.6;
            padding: 2px;
            box-shadow: inset 0 0 0 1px var(--tokyo-red);
            pointer-events: none;
            user-select: none;
        }

        .hanko-inner {
            border: 1px solid var(--tokyo-red);
            border-radius: 50%;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* Card Style */
        .modern-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .btn-entry {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 12px;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        .btn-entry:active { transform: translateY(2px); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            backdrop-filter: blur(4px);
        }
        
        .modal-content {
            background: #fdfbf7;
            margin: 15% auto;
            width: 90%;
            max-width: 450px;
            border-radius: 24px;
            padding: 24px;
        }
    </style>
</head>
<body>

    <div class="sakura-container" id="sakura-box"></div>

    <div class="glass-overlay p-4 pt-8 pb-24">
        
        <!-- Modal Arsip -->
        <div id="modal-arsip" class="modal">
            <div class="modal-content shadow-2xl">
                <div class="flex justify-between items-center border-b border-gray-200 pb-4 mb-4">
                    <h2 class="font-bold text-gray-800 tracking-widest uppercase text-xs">Arsip Gulungan Lama</h2>
                    <button onclick="toggleArchive()" class="text-2xl text-gray-400">&times;</button>
                </div>
                <div id="archive-list" class="space-y-3 overflow-y-auto max-h-[50vh]"></div>
            </div>
        </div>

        <div class="max-w-md mx-auto relative z-10">
            
            <!-- Header -->
            <header class="text-center mb-10">
                <div class="inline-block bg-red-600 text-white px-3 py-1 mb-3 rounded-md font-bold text-[8px] tracking-[0.4em] shadow-lg">
                    APATO 404
                </div>
                <h1 class="text-3xl font-black text-white tracking-tight">
                    JAPANESE <span class="text-red-500">LEDGER</span>
                </h1>
                <div id="active-period-label" class="text-[9px] mt-2 font-bold text-white/60 uppercase tracking-[0.2em]">
                    Memuat Sesi...
                </div>
            </header>

            <!-- Dashboard Saldo -->
            <div class="modern-card p-8 mb-8 text-center relative overflow-hidden">
                <!-- Stempel Hanko Tradisional -->
                <div class="hanko-stamp">
                    <div class="hanko-inner">
                        <span>公式</span>
                        <span style="font-size: 6px; margin-top: 2px;">APATO</span>
                    </div>
                </div>

                <p class="text-[9px] uppercase font-black tracking-[0.2em] text-gray-400 mb-2">Total Saldo Periode</p>
                <div class="text-5xl font-black text-gray-900 tracking-tighter" id="total-saldo" style="font-family: 'Noto Serif JP', serif;">¥0</div>
                
                <div class="mt-6 flex justify-center items-center gap-3 text-[8px] font-bold text-gray-300 border-t border-gray-100 pt-4">
                    <span id="auth-status">MENUNGGU...</span>
                    <span class="w-1 h-1 bg-gray-200 rounded-full"></span>
                    <span id="sync-time">--:--</span>
                </div>
            </div>

            <!-- Navigasi -->
            <div class="grid grid-cols-2 gap-4 mb-10">
                <button onclick="toggleArchive()" class="bg-white/10 hover:bg-white/20 text-white p-3 rounded-2xl text-[9px] font-black uppercase tracking-widest flex items-center justify-center gap-2 border border-white/10 transition-all">
                    📜 Buka Arsip
                </button>
                <div class="bg-white/10 text-white p-3 rounded-2xl text-[9px] font-black uppercase tracking-widest flex items-center justify-center border border-white/10">
                    Data: <span id="item-count" class="ml-2 text-red-500">00</span>
                </div>
            </div>

            <!-- Form Input -->
            <div class="modern-card p-6 mb-10 shadow-2xl">
                <div class="space-y-5">
                    <div class="relative">
                        <label class="text-[8px] font-black text-gray-400 uppercase tracking-widest absolute -top-2 left-3 bg-white px-2">Pengisi</label>
                        <select id="input-user" class="w-full bg-gray-50 rounded-xl p-4 outline-none text-sm font-bold border border-gray-100">
                            <option value="" disabled selected>Pilih...</option>
                            <option value="Amry Galih N">Amry Galih N</option>
                            <option value="Fikri Muzaki">Fikri Muzaki</option>
                            <option value="Gungun G">Gungun G</option>
                            <option value="Saleh H">Saleh H</option>
                        </select>
                    </div>
                    <div class="relative">
                        <label class="text-[8px] font-black text-gray-400 uppercase tracking-widest absolute -top-2 left-3 bg-white px-2">Deskripsi</label>
                        <input type="text" id="input-ket" class="w-full bg-gray-50 rounded-xl p-4 outline-none text-sm font-bold border border-gray-100 uppercase" placeholder="KETERANGAN..." autocomplete="off">
                    </div>
                    <div class="relative">
                        <label class="text-[8px] font-black text-gray-400 uppercase tracking-widest absolute -top-2 left-3 bg-white px-2">Jumlah (¥)</label>
                        <input type="number" id="input-nom" class="w-full bg-gray-50 rounded-xl p-4 outline-none text-2xl font-black border border-gray-100" placeholder="0">
                    </div>
                    <div class="grid grid-cols-2 gap-4 pt-2">
                        <button id="btn-in" disabled class="btn-entry bg-green-500 text-white py-4 shadow-lg shadow-green-500/20 text-[10px]">MASUK / 入</button>
                        <button id="btn-out" disabled class="btn-entry bg-red-600 text-white py-4 shadow-lg shadow-red-600/20 text-[10px]">KELUAR / 出</button>
                    </div>
                </div>
            </div>

            <!-- Riwayat -->
            <div class="flex items-center gap-3 mb-6">
                <div class="h-[2px] flex-grow bg-white/10"></div>
                <h3 class="text-[10px] font-black text-white/40 uppercase tracking-[0.3em]">Transaksi Aktif</h3>
                <div class="h-[2px] flex-grow bg-white/10"></div>
            </div>
            
            <div id="ledger-list" class="space-y-4"></div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>

    <script>
        // Sakura Falling Effect
        function createSakura() {
            const box = document.getElementById('sakura-box');
            const petal = document.createElement('div');
            petal.className = 'sakura';
            const size = Math.random() * 8 + 4 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 4 + 6 + 's';
            box.appendChild(petal);
            setTimeout(() => petal.remove(), 10000);
        }
        setInterval(createSakura, 600);

        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyAiMAg6_CsXal5g_EXLbgoQ35VIboSRJ4A",
            authDomain: "kas-ac289.firebaseapp.com",
            databaseURL: "https://kas-ac289-default-rtdb.firebaseio.com",
            projectId: "kas-ac289",
            storageBucket: "kas-ac289.firebasestorage.app",
            messagingSenderId: "341907599331",
            appId: "1:341907599331:web:35f1d7e63014899a4abad6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const path = 'apato_404_ledger';

        function getPeriodRange() {
            const now = new Date();
            let start, end;
            if (now.getDate() >= 16) {
                start = new Date(now.getFullYear(), now.getMonth(), 16, 0, 0, 0);
                end = new Date(now.getFullYear(), now.getMonth() + 1, 15, 23, 59, 59);
            } else {
                start = new Date(now.getFullYear(), now.getMonth() - 1, 16, 0, 0, 0);
                end = new Date(now.getFullYear(), now.getMonth(), 15, 23, 59, 59);
            }
            return { 
                start: start.getTime(), 
                end: end.getTime(), 
                label: `${start.toLocaleDateString('id-ID', {day:'numeric', month:'short'})} - ${end.toLocaleDateString('id-ID', {day:'numeric', month:'short'})}` 
            };
        }

        const currentRange = getPeriodRange();
        document.getElementById('active-period-label').innerText = currentRange.label;

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-status').innerText = "STABIL";
                document.getElementById('btn-in').disabled = false;
                document.getElementById('btn-out').disabled = false;
                loadData();
            } else {
                auth.signInAnonymously();
            }
        });

        function send(type) {
            const user = document.getElementById('input-user').value;
            const ket = document.getElementById('input-ket').value;
            const nom = document.getElementById('input-nom').value;
            if(!user || !ket || !nom) return;

            db.ref(path).push({
                user, desc: ket.toUpperCase(), amt: parseInt(nom), type,
                ts: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                document.getElementById('input-ket').value = "";
                document.getElementById('input-nom').value = "";
            });
        }

        document.getElementById('btn-in').onclick = () => send('masuk');
        document.getElementById('btn-out').onclick = () => send('keluar');

        function toggleArchive() {
            const m = document.getElementById('modal-arsip');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }

        function loadData() {
            db.ref(path).on('value', (snap) => {
                const list = document.getElementById('ledger-list');
                const archList = document.getElementById('archive-list');
                const totalEl = document.getElementById('total-saldo');
                
                list.innerHTML = "";
                archList.innerHTML = "";
                let total = 0, activeCount = 0;
                const data = snap.val();
                if(!data) {
                    totalEl.innerText = "¥0";
                    return;
                }

                const items = Object.keys(data).map(k => ({id: k, ...data[k]})).sort((a,b) => b.ts - a.ts);

                items.forEach(item => {
                    const isInc = item.type === 'masuk';
                    const isActive = item.ts >= currentRange.start && item.ts <= currentRange.end;

                    const cardHTML = `
                        <div class="bg-white rounded-2xl p-4 flex justify-between items-center shadow-lg">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-[7px] bg-gray-900 text-white px-1.5 py-0.5 rounded font-black uppercase">${item.user}</span>
                                    <h4 class="text-[10px] font-black text-gray-800 uppercase tracking-tight">${item.desc}</h4>
                                </div>
                                <p class="text-[7px] text-gray-400 font-bold uppercase tracking-wider">${new Date(item.ts).toLocaleDateString('id-ID', {day:'numeric', month:'short'})} • ${new Date(item.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-sm font-black ${isInc ? 'text-green-600' : 'text-red-600'}">
                                    ${isInc ? '+' : '-'} ¥${item.amt.toLocaleString()}
                                </span>
                                ${isActive ? `<button onclick="deleteData('${item.id}')" class="text-gray-200 hover:text-red-500 text-lg">&times;</button>` : ''}
                            </div>
                        </div>
                    `;

                    if (isActive) {
                        activeCount++;
                        total += isInc ? item.amt : -item.amt;
                        list.insertAdjacentHTML('beforeend', cardHTML);
                    } else {
                        archList.insertAdjacentHTML('beforeend', cardHTML);
                    }
                });

                totalEl.innerText = "¥" + total.toLocaleString();
                document.getElementById('item-count').innerText = activeCount < 10 ? "0"+activeCount : activeCount;
                document.getElementById('sync-time').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            });
        }

        window.deleteData = (id) => confirm("Hapus data?") && db.ref(path).child(id).remove();
    </script>
</body>
</html>
